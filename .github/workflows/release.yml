# Publication to PyPI is deliberately DEFERRED (owner decision, see
# docs/superpowers/specs/2026-08-23-telegram-ai-cli-design.md §12.5): a name
# claimed on a public registry is claimed forever, and that call is made once,
# separately, not by this file existing. This workflow must stay correct and
# ready to run, but its trigger is scoped so it can NEVER fire on an ordinary
# push to main -- only on pushing a `v*` tag, which nobody does by accident.
#
# Actions are pinned to a commit SHA for the same reason as in ci.yml (mutable
# upstream tags). Verified via `gh api repos/<owner>/<repo>/releases/latest`
# and the matching git ref on 2026-08-23:
#   actions/checkout               v7.0.1   -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python            v7.0.0   -> 5fda3b95a4ea91299a34e894583c3862153e4b97
#   actions/upload-artifact         v7.0.1   -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       v8.0.1   -> 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   pypa/gh-action-pypi-publish     v1.14.2  -> dc37677b2e1c63e2034f94d8a5b11f265b73ba33
#   softprops/action-gh-release     v3.0.2   -> fe965f7af51af5f2602596916f38a38df2e33de0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build backend
        run: python -m pip install --constraint constraints.txt build
      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist/
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/telegram-ai-cli/
    permissions:
      # OIDC token exchanged for a short-lived upload credential -- no PyPI
      # token is stored as a repo secret at all. Requires the "telegram-ai-cli"
      # trusted publisher to actually be configured on PyPI's side first; this
      # job will fail closed (no such thing as an accidental anonymous upload)
      # until that one-time setup happens as part of the deferred publish
      # decision.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          # Distinct artifact from the sdist/wheel; PyPI itself does not
          # accept a checksums file as a release asset.
          skip-existing: false

  github-release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create draft release with checksums
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          # Draft, not published: a human reviews and hits "Publish release"
          # deliberately, mirroring the same "no accidental publish" posture
          # as the tag-only trigger above.
          draft: true
          generate_release_notes: true
          files: |
            dist/*
